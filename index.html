<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#04060c">
<style>:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Schichtplaner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Exo+2:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap">
<style id="app-css">
/* Layout: Leitstand 2200. Dunkle Kommandozentrale mit Glasflächen; oben Kopf und Reiter, darunter Zeitleiste (Monate mit KWs) und das Jahresraster mit fester Namensspalte und leuchtenden Besetzungszeilen. */
:root{
  color-scheme:dark;
  --bg:#04060c; --bg-2:#0a1020; --panel:rgba(16,24,44,.66); --panel-solid:#0b1222; --panel-head:#0e1730;
  --line:rgba(120,200,255,.13); --line-strong:rgba(120,210,255,.34);
  --fg:#e9f2ff; --muted:#8b9cbc; --dim:#5d6b88;
  --accent:#4ff0ff; --accent-2:#a98bff; --accent-fg:#02141a; --accent-soft:rgba(79,240,255,.10);
  --glow:0 0 0 1px rgba(79,240,255,.35),0 0 18px rgba(79,240,255,.22);
  --gelb-bg:#ffb72b; --gelb-fg:#1c1100; --blau-bg:#2fd3ff; --blau-fg:#001a24; --indigo-bg:#7d5cff; --indigo-fg:#f5f2ff;
  --gruen-bg:#38f5a2; --gruen-fg:#00200f; --tuerkis-bg:#16e0c0; --tuerkis-fg:#00201b; --orange-bg:#ff7d40; --orange-fg:#220a00;
  --rose-bg:#ff5cb3; --rose-fg:#2a0016; --grau-bg:#56657f; --grau-fg:#eef3ff;
  --u-bg:#b6c3d9; --u-fg:#0b1322; --g-bg:#c9a8ff; --g-fg:#1b0c3b; --k-bg:#ff4f6d; --k-fg:#2b0009;
  --bad:#ff4f6d; --bad-bg:rgba(255,79,109,.14); --warn:#ffc65c; --warn-bg:rgba(255,198,92,.13); --good:#38f5a2;
  --display:'Chakra Petch','Arial Narrow',sans-serif; --body:'Exo 2',system-ui,-apple-system,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --name-w:212px; --cell-w:32px; --day-w:25px;
}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;min-height:100%}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(60vw 40vh at 85% -5%,rgba(169,139,255,.20),transparent 70%),
    radial-gradient(55vw 45vh at 5% 0%,rgba(79,240,255,.14),transparent 70%),
    radial-gradient(70vw 50vh at 50% 110%,rgba(47,211,255,.08),transparent 70%),
    linear-gradient(rgba(120,200,255,.045) 1px,transparent 1px) 0 0/44px 44px,
    linear-gradient(90deg,rgba(120,200,255,.045) 1px,transparent 1px) 0 0/44px 44px,
    var(--bg)}
#app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;max-width:1520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
h1{font-size:1.75rem;line-height:1;letter-spacing:.16em;text-transform:uppercase;background:linear-gradient(90deg,var(--fg),var(--accent) 55%,var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:1.3rem;letter-spacing:.04em}
h3{font-size:1.05rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:rgba(79,240,255,.35)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;justify-content:space-between;padding:14px 18px;border:1px solid var(--line);border-radius:18px;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);position:relative;overflow:hidden}
.top::after{content:"";position:absolute;left:18px;right:18px;bottom:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),var(--accent-2),transparent);opacity:.7}
.brand{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand .core{width:34px;height:34px;border-radius:10px;flex:none;background:conic-gradient(from 210deg,var(--accent),var(--accent-2),var(--gelb-bg),var(--accent));box-shadow:0 0 20px rgba(79,240,255,.35);position:relative}
.brand .core::after{content:"";position:absolute;inset:5px;border-radius:7px;background:var(--panel-solid)}
.brand small{color:var(--muted);font-family:var(--mono);font-size:.78rem;letter-spacing:.04em}
.savebox{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{font-family:var(--mono);font-size:.74rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.dirty{border-color:rgba(255,198,92,.45);color:var(--warn);background:var(--warn-bg)}
.pill.good{border-color:rgba(56,245,162,.35);color:var(--good)}
.pill.good::before,.pill.dirty::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:1px;}
.btn{border:1px solid var(--line-strong);background:rgba(16,28,52,.7);padding:8px 15px;border-radius:10px;font-family:var(--display);font-weight:600;letter-spacing:.04em;display:inline-flex;align-items:center;gap:6px;transition:box-shadow .2s,border-color .2s,transform .1s}
.btn:hover{border-color:var(--accent);box-shadow:var(--glow)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(100deg,var(--accent),var(--accent-2));color:var(--accent-fg);border-color:transparent;box-shadow:0 0 22px rgba(79,240,255,.28)}
.btn.small{padding:5px 11px;font-size:.86rem}
.btn.danger{color:var(--bad);border-color:rgba(255,79,109,.35)}
.btn.danger.armed{background:var(--bad);color:#1a0006;border-color:var(--bad)}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px;border:1px solid var(--line);border-radius:14px;background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tab{border:0;background:none;padding:8px 16px;border-radius:10px;font-family:var(--display);font-size:1rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap;transition:color .2s,background .2s}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--accent-fg);background:linear-gradient(100deg,var(--accent),var(--accent-2));box-shadow:0 0 18px rgba(79,240,255,.25)}
.banner{border:1px solid var(--line-strong);background:linear-gradient(100deg,rgba(79,240,255,.09),rgba(169,139,255,.09));border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.banner p{margin:0;max-width:78ch;color:var(--fg)}
.msg{border:1px solid rgba(255,198,92,.4);background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px}
.msg.bad{border-color:rgba(255,79,109,.45);background:var(--bad-bg);color:var(--bad)}
.msg.ok{border-color:var(--line-strong);background:var(--accent-soft);color:var(--fg)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.toolbar .grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:.86rem;color:var(--muted);font-variant-numeric:tabular-nums;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.stat b{font-family:var(--mono);font-size:1.25rem;color:var(--fg);margin-right:6px}
.stat.bad{border-color:rgba(255,79,109,.5);background:var(--bad-bg)} .stat.bad b{color:var(--bad);text-shadow:0 0 12px rgba(255,79,109,.6)}
.stat.good b{color:var(--good);text-shadow:0 0 12px rgba(56,245,162,.55)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-grid;place-items:center;min-width:20px;height:18px;padding:0 4px;box-sizing:border-box;border-radius:5px;font-family:var(--mono);font-weight:600;font-size:.76rem}
.sc-gelb{background:var(--gelb-bg);color:var(--gelb-fg)} .sc-blau{background:var(--blau-bg);color:var(--blau-fg)} .sc-indigo{background:var(--indigo-bg);color:var(--indigo-fg)}
.sc-gruen{background:var(--gruen-bg);color:var(--gruen-fg)} .sc-tuerkis{background:var(--tuerkis-bg);color:var(--tuerkis-fg)} .sc-orange{background:var(--orange-bg);color:var(--orange-fg)}
.sc-rose{background:var(--rose-bg);color:var(--rose-fg)} .sc-grau{background:var(--grau-bg);color:var(--grau-fg)}
.ab-U{background:var(--u-bg);color:var(--u-fg)} .ab-G{background:var(--g-bg);color:var(--g-fg)} .ab-K{background:var(--k-bg);color:var(--k-fg)}
/* Zeitleiste: Monate mit ihren KWs */
.timeline{display:flex;gap:6px;overflow-x:auto;padding:8px;border:1px solid var(--line);border-radius:16px;background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);scrollbar-width:thin}
.mon{flex:1 0 auto;display:flex;flex-direction:column;gap:6px;padding:7px 9px;border-radius:12px;border:1px solid transparent;transition:border-color .2s,background .2s}
.mon.vis{border-color:var(--line-strong);background:rgba(79,240,255,.06)}
.mname{border:0;background:none;padding:0;text-align:left;font-family:var(--display);font-weight:700;font-size:.82rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.mname:hover,.mon.vis .mname{color:var(--accent)}
.mon.now .mname::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.kws{display:flex;gap:4px}
.kw{min-width:31px;height:26px;padding:0 4px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.02);font-family:var(--mono);font-size:.76rem;color:var(--fg);transition:background .15s,border-color .15s,box-shadow .15s}
.kw:hover{border-color:var(--accent);box-shadow:var(--glow)}
.kw.now{border-color:var(--accent);color:var(--accent)}
.kw.vis{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:var(--accent-fg);border-color:transparent}
.navrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
/* Raster */
.grid-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line-strong);border-radius:16px;background:var(--panel-solid);box-shadow:0 0 0 1px rgba(0,0,0,.4),0 20px 60px rgba(0,0,0,.45),0 0 40px rgba(79,240,255,.06)}
table.grid{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
.grid th,.grid td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.grid thead th{position:sticky;background:var(--panel-head);z-index:2;font-weight:500;font-size:.74rem;color:var(--muted)}
.grid thead tr.m th{top:0;height:24px;text-align:left;padding-left:8px;font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.78rem;color:var(--accent)}
.grid thead tr.k th{top:24px;height:24px;width:var(--cell-w);min-width:var(--cell-w);text-align:center;font-family:var(--mono)}
.grid thead tr.k th.now{background:var(--accent);color:var(--accent-fg)}
.grid thead tr.kw th{top:24px;height:22px;text-align:left;padding-left:6px;font-family:var(--mono);font-size:.72rem;color:var(--fg);border-left:2px solid var(--line-strong)}
.grid thead tr.kw th.now{background:linear-gradient(90deg,var(--accent),var(--accent-2));color:var(--accent-fg)}
.grid thead tr.dy th{top:46px;height:32px;width:var(--day-w);min-width:var(--day-w);text-align:center;font-size:.62rem;line-height:1.1;letter-spacing:.04em}
.grid thead tr.dy th b{display:block;font-family:var(--mono);font-weight:500;font-size:.76rem;color:var(--fg)}
.grid thead tr.dy th.we{opacity:.5}
.grid thead tr.dy th.today{background:var(--accent);color:var(--accent-fg)} .grid thead tr.dy th.today b{color:var(--accent-fg)}
.grid .nm{position:sticky;left:0;z-index:1;background:var(--panel-solid);width:var(--name-w);min-width:var(--name-w);max-width:var(--name-w);text-align:left;padding:3px 8px;box-shadow:1px 0 0 var(--line-strong)}
.grid thead .nm{z-index:3;background:var(--panel-head);font-family:var(--display);letter-spacing:.12em;text-transform:uppercase;font-size:.74rem}
.nmrow{display:flex;align-items:center;gap:6px;justify-content:space-between}
.nmrow .who{min-width:0;overflow:hidden}
.nmrow .who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:.9rem}
.nmrow .who small{display:block;color:var(--dim);font-family:var(--mono);font-size:.66rem;white-space:nowrap}
.nmbtn{border:0;background:none;padding:0;margin:0;text-align:left;color:inherit;cursor:pointer;display:block;max-width:100%;min-width:0}
.nmbtn:hover b{color:var(--accent)}
.shift{display:flex;gap:3px;flex:none}
.shift button{border:1px solid var(--line);background:transparent;border-radius:6px;width:22px;height:22px;padding:0;font-size:.75rem;line-height:1;color:var(--muted)}
.shift button:hover{border-color:var(--accent);color:var(--accent)}
.lock{font-family:var(--mono);font-size:.66rem;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.tagS{display:inline-block;font-family:var(--mono);font-size:.58rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;border:1px solid rgba(169,139,255,.55);color:var(--accent-2);border-radius:4px;padding:0 4px;margin-left:5px;vertical-align:1px}
tr.sec td{background:linear-gradient(90deg,rgba(79,240,255,.07),rgba(169,139,255,.03) 40%,transparent);font-family:var(--display);font-weight:600;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;padding:5px 8px;color:var(--accent)}
.grid tr.sec td.nm{background:#0c1729}
.secname{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seqmini{display:flex;gap:2px;margin-top:3px;flex-wrap:wrap}
.seqmini i{font-style:normal;font-family:var(--mono);font-size:.6rem;font-weight:700;min-width:13px;height:13px;line-height:13px;text-align:center;border-radius:3px;letter-spacing:0}
.secsub{display:block;font-family:var(--body);text-transform:none;letter-spacing:0;font-size:.7rem;color:var(--muted);font-weight:500}
td.c{height:30px;text-align:center;font-family:var(--mono);font-weight:600;font-size:.82rem;cursor:pointer;position:relative}
td.c:hover,td.d:hover{outline:2px solid var(--accent);outline-offset:-2px;z-index:1}
td.c.off,td.d.off{background:repeating-linear-gradient(45deg,transparent,transparent 4px,rgba(120,200,255,.05) 4px,rgba(120,200,255,.05) 8px);cursor:default}
td.c.nowc{box-shadow:inset 2px 0 0 var(--accent),inset -2px 0 0 var(--accent)}
td.d{width:var(--day-w);min-width:var(--day-w);height:30px;text-align:center;font-family:var(--mono);font-weight:600;font-size:.72rem;cursor:pointer;position:relative;white-space:nowrap;overflow:hidden}
td.d.we{background:rgba(2,4,10,.55);cursor:default}
td.d.we:hover{outline:0}
td.d.today{box-shadow:inset 0 0 0 2px var(--accent),inset 0 0 12px rgba(79,240,255,.45)}
.wk{border-left:2px solid var(--line-strong)!important}
td.jump::after{content:"";position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--bad);box-shadow:0 0 6px var(--bad)}
td.man::before{content:"";position:absolute;left:0;bottom:0;border-left:7px solid var(--fg);border-top:7px solid transparent;opacity:.8}
td.c.part::before{content:"";position:absolute;left:3px;right:3px;bottom:2px;height:3px;border-radius:2px;background:var(--g-bg)}
tfoot td{position:sticky;background:var(--panel-head);z-index:1;height:26px;text-align:center;font-family:var(--mono);font-size:.76rem;font-weight:500;color:var(--muted);bottom:0}
.grid tfoot td.nm{z-index:3;background:var(--panel-head);font-family:var(--display);font-size:.8rem;letter-spacing:.04em;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
tfoot td.over{background:var(--bad);color:#1a0006;font-weight:700}
tfoot td.under{background:var(--warn-bg);color:var(--warn)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:rgba(16,28,52,.6)}
.seg button{border:0;background:none;padding:7px 14px;font-family:var(--display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:linear-gradient(100deg,var(--accent),var(--accent-2));color:var(--accent-fg)}
/* Dialog */
.sheet-bg{position:fixed;inset:0;background:rgba(2,4,10,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px));overflow:auto}
@media (min-width:700px){.sheet-bg{align-items:center}}
.sheet{background:linear-gradient(160deg,rgba(20,32,60,.96),rgba(10,16,32,.98));border:1px solid var(--line-strong);border-radius:18px;padding:20px;width:min(470px,100%);display:flex;flex-direction:column;gap:13px;box-shadow:0 0 0 1px rgba(79,240,255,.15),0 30px 80px rgba(0,0,0,.6),0 0 60px rgba(79,240,255,.12)}
.sheet .sub{color:var(--muted);font-size:.86rem;margin-top:3px;font-family:var(--mono)}
.sheet h4{margin:0;font-family:var(--display);font-size:.8rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.16em}
.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.choices button{border:2px solid transparent;border-radius:12px;padding:10px 4px;font-family:var(--mono);font-weight:700;font-size:1.05rem;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .1s,box-shadow .2s}
.choices button:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.choices button small{font-family:var(--body);font-weight:500;font-size:.7rem;text-align:center;line-height:1.15}
.choices button.sel{border-color:var(--fg);box-shadow:0 0 0 2px var(--panel-solid),0 0 16px rgba(255,255,255,.35)}
.choices button.neutral{background:rgba(255,255,255,.06);color:var(--fg);border-color:var(--line-strong)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
label.inl{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;color:var(--muted)}
input[type=text],input[type=number],input[type=time],input[type=date],select{border:1px solid var(--line-strong);background:rgba(4,8,18,.7);border-radius:9px;padding:6px 9px;min-width:0;color:var(--fg)}
input:focus,select:focus{border-color:var(--accent);box-shadow:var(--glow);outline:0}
input[type=number]{width:5.2em;font-family:var(--mono)}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
input.code{width:4.2em;text-transform:uppercase;font-family:var(--mono);font-weight:700}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .2s}
.card:hover{border-color:var(--line-strong)}
.card .f{display:flex;flex-direction:column;gap:4px;font-size:.7rem;color:var(--muted);min-width:0;text-transform:uppercase;letter-spacing:.1em;font-family:var(--display)}
.card .f > *:not(span){font-size:.95rem;color:var(--fg);text-transform:none;letter-spacing:0;font-family:var(--body)}
.card .grow{flex:1 1 180px}
.card .grow input{width:100%;box-sizing:border-box}
.seq{display:flex;flex-wrap:wrap;gap:4px}
.seq button.sw{min-width:28px;height:26px;border:0;font-size:.86rem}
.seq button.sw:hover{outline:2px solid var(--bad)}
.hint{color:var(--muted);font-size:.86rem;max-width:82ch;margin:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
textarea{width:100%;min-height:120px;border:1px solid var(--line-strong);border-radius:10px;background:rgba(4,8,18,.8);color:var(--fg);font:12px/1.4 var(--mono);padding:8px;box-sizing:border-box}
.spfair{display:flex;flex-wrap:wrap;gap:8px}

/* Kalender (ISO-Wochen, gerechnet in UTC) */

function migrate(s){

    s.schichten.forEach(function(x){var z=alt[x.code];if(z&&x.von===z[0]&&x.bis===z[1]){x.von=z[2];x.bis=z[3]}});s.zeitenV2=true}

var state=migrate(JSON.parse(document.getElementById('state').textContent));

/* Daten */
function rh(id){for(var i=0;i<state.rhythmen.length;i++)if(state.rhythmen[i].id===id)return state.rhythmen[i];return null}

function sch(c){for(var i=0;i<state.schichten.length;i++)if(state.schichten[i].code===c)return state.schichten[i];return null}
function shName(c){var x=sch(c);return x?x.name:(c||'-')}
function shCls(c){var x=sch(c);return x?'sc-'+x.farbe:'sc-grau'}
function shTime(c){var x=sch(c);return x&&x.von&&x.bis?x.von+'-'+x.bis:''}
function len(m){var r=rh(m.rhythmusId);return r?r.folge.length:0}

function key(w){return state.jahr+'-'+(w+1)}
function ov(m,w){var o=state.abw[m.id];return o?o[key(w)]:undefined}
function active(m,w){return w>=(m.ab||1)-1}
function dayAbs(m,w,d){var o=state.tage[m.id];return o?o[iso(monday(w)+d*DAY)]:undefined}
function awayWeek(m,w){for(var d=0;d<5;d++)if(!dayAbs(m,w,d))return false;return true}
function anyAbs(m,w){for(var d=0;d<5;d++)if(dayAbs(m,w,d))return true;return false}
function codeUsed(c){if(state.rhythmen.some(function(r){return r.folge.indexOf(c)>=0}))return true;return Object.keys(state.abw).some(function(id){var o=state.abw[id];return Object.keys(o).some(function(k){return o[k]===c})})}

/* Ausgleich: dynamische Programmierung über alle Wochen für die Springer */
function natural(m){var r=rh(m.rhythmusId),s={};if(r&&r.folge.length>1){for(var i=0;i<r.folge.length;i++)s[r.folge[i]+'|'+r.folge[(i+1)%r.folge.length]]=1}return s}
function fair(pick,spr,T,init,W,Z,n,nIdx,free){
  var k=spr.length;if(k<2)return;
  var same=function(i,j){return spr[i].rhythmusId===spr[j].rhythmusId&&spr[i].anlage===spr[j].anlage};

}
function solve(phases){
  var W=weeksIn(state.jahr),cap=+state.anlagen||6,M=state.mitarbeiter;
  var codes=state.schichten.map(function(x){return x.code}),n=codes.length,CI={};codes.forEach(function(c,i){CI[c]=i});
  var AW=n,NO=n+1,Z=n+2;
  var bes=[],spo=[];state.schichten.forEach(function(x,i){if(x.besetzung)bes.push(i);if(x.springer)spo.push(i)});
  var ph=function(m){return phases&&phases[m.id]!=null?phases[m.id]:m.phase};
  var fixed=[],spr=[],note='';
  M.forEach(function(m){(m.springer?spr:fixed).push(m)});
  if(spr.length&&(!spo.length||Math.pow(spo.length,spr.length)>4096)){note=spo.length?'Zu viele Springer oder Springer-Schichten für den automatischen Ausgleich. Die Springer laufen gerade nach ihrem Schichtmodell.':'Keine Schicht ist für Springer freigegeben (Reiter „Schichten“). Die Springer laufen gerade nach ihrem Schichtmodell.';fixed=M.slice();spr=[]}
  var fc=[],cells={};

  fixed.forEach(function(m){var row=[];for(var w=0;w<W;w++){var c=null,man=false,aw=false;if(active(m,w)){var o=ov(m,w);if(o){c=o;man=true}else c=base(m,w,ph(m));aw=awayWeek(m,w);if(m.anlage&&!aw&&c!=null&&CI[c]!=null)fc[w][CI[c]]++}row.push({c:c,man:man,away:aw})}cells[m.id]=row});
  var k=spr.length,total=0;
  if(k){
    var T=spr.map(function(m){var nat=natural(m),t=new Int32Array(Z*Z);for(var a=0;a<Z;a++)for(var b=0;b<Z;b++){var v=0;if(a<n&&b<n&&!nat[codes[a]+'|'+codes[b]])v=a===b?10:12+(codes[a]==='N'&&codes[b]==='F'?3:0);t[a*Z+b]=v}return t});
    var init=spr.map(function(m){var c=base(m,-1,ph(m));return c!=null&&CI[c]!=null?CI[c]:NO});
    var free=spr.map(function(){return new Array(W)});
    var states=[];
    for(var w=0;w<W;w++){var out=[[]];spr.forEach(function(m,i){var arr;if(!active(m,w))arr=[NO];else if(awayWeek(m,w))arr=[AW];else{var o=ov(m,w);arr=(o&&CI[o]!=null)?[CI[o]]:spo}free[i][w]=arr===spo;var nx=[];out.forEach(function(t){arr.forEach(function(c){nx.push(t.concat(c))})});out=nx});states.push(out)}
    spr.forEach(function(m,i){for(var w=W-2;w>=0;w--)free[i][w]=free[i][w]&&free[i][w+1]});
    var BAL=6,nb=bes.length;
    var wc=function(w,t){var c=Array.prototype.slice.call(fc[w]);for(var i=0;i<k;i++)if(spr[i].anlage&&t[i]<n)c[t[i]]++;if(!nb)return 0;var sum=0;for(var q=0;q<nb;q++)sum+=c[bes[q]];var mean=sum/nb,cost=0;for(var q=0;q<nb;q++){var v=c[bes[q]];if(v>cap)cost+=1000*(v-cap);cost+=BAL*(v-mean)*(v-mean)}return cost};
    var dp=[],bp=[];
    var st0=states[0],d0=new Float64Array(st0.length);
    for(var j=0;j<st0.length;j++){var x=wc(0,st0[j]);for(var i=0;i<k;i++)x+=T[i][init[i]*Z+st0[j][i]];d0[j]=x}
    dp.push(d0);bp.push(null);
    for(var w=1;w<W;w++){
      var S=states[w],P=states[w-1],prev=dp[w-1],d=new Float64Array(S.length),b=new Int32Array(S.length),PL=P.length;
      for(var j=0;j<S.length;j++){var best=Infinity,bi=0,cur=S[j];
        for(var p=0;p<PL;p++){var x=prev[p];if(x>=best)continue;var pt=P[p];for(var i=0;i<k&&x<best;i++)x+=T[i][pt[i]*Z+cur[i]];if(x<best){best=x;bi=p}}

      dp.push(d);bp.push(b);
    }
    var last=dp[W-1],bj=0;for(var j=1;j<last.length;j++)if(last[j]<last[bj])bj=j;total=last[bj];
    var pick=new Array(W);for(var w=W-1;w>=0;w--){pick[w]=states[w][bj].slice();if(w>0)bj=bp[w][bj]}
    if(!phases)fair(pick,spr,T,init,W,Z,n,CI.N!=null?CI.N:-1,free);

  }

  for(var w=0;w<W;w++){var c={},dd=[];codes.forEach(function(x){c[x]=0});for(var d=0;d<5;d++){var o={};codes.forEach(function(x){o[x]=0});dd.push(o)}
    M.forEach(function(m){var x=cells[m.id][w];if(!m.anlage||!x||!x.c||c[x.c]==null)return;if(!x.away)c[x.c]++;for(var d=0;d<5;d++)if(!dayAbs(m,w,d))dd[d][x.c]++});
    counts.push(c);days.push(dd)}

  var over=0,under=0;counts.forEach(function(c){var r=rate(c,besC,cap);if(r.over)over++;else if(r.under)under++});
  var sstat=spr.map(function(m){var j=0,nn=0;cells[m.id].forEach(function(x){if(x.jump)j++;if(x.c==='N')nn++});return {m:m,jumps:j,n:nn}});
  if(!k){counts.forEach(function(c){besC.forEach(function(s){if(c[s]>cap)total+=1000*(c[s]-cap)})})}
  return {cells:cells,counts:counts,days:days,over:over,under:under,sstat:sstat,cost:total,note:note,W:W,cap:cap,bes:besC};
}
function rate(c,besC,cap){var p=0;besC.forEach(function(s){p+=c[s]});var lo=besC.length?Math.min(cap,Math.floor(p/besC.length)):0;var r={over:false,under:false,lo:lo};besC.forEach(function(s){if(c[s]>cap)r.over=true;else if(c[s]<lo)r.under=true});return r}
function cellCls(v,c,besC,cap){var r=rate(c,besC,cap);return v>cap?'over':(v<r.lo?'under':'')}

/* Startverteilung vorschlagen: koordinatenweise Suche über die Startwochen aller nicht festgelegten Leute */
function optimize(){
  var free=state.mitarbeiter.filter(function(m){return !m.fest&&len(m)>1});
  if(!free.length){ui.msg={t:'Alle Startwochen sind festgelegt. Entferne bei einzelnen Leuten das Häkchen „Startwoche fest“, damit die App sie verschieben darf.'};render();return}
  ui.busy='Suche günstige Startwochen …';render();
  var cur={};state.mitarbeiter.forEach(function(m){cur[m.id]=m.phase});
  var runs=[clone(cur)];
  for(var r=0;r<2;r++){var x=clone(cur);free.forEach(function(m){x[m.id]=Math.floor(Math.random()*len(m))});runs.push(x)}
  var bestAll=null,bestCost=Infinity,ri=0;
  function runOne(){
    if(ri>=runs.length){finish();return}
    var ph=runs[ri++],c=solve(ph).cost,sweep=0;
    (function step(){
      var improved=false;
      free.forEach(function(m){var L=len(m),orig=ph[m.id],bp=orig,bc=c;for(var p=0;p<L;p++){if(p===orig)continue;ph[m.id]=p;var v=solve(ph).cost;if(v<bc-1e-9){bc=v;bp=p}}ph[m.id]=bp;if(bp!==orig){c=bc;improved=true}});
      sweep++;
      if(improved&&sweep<4)setTimeout(step,0);else{if(c<bestCost){bestCost=c;bestAll=clone(ph)}setTimeout(runOne,0)}
    })();
  }
  function finish(){
    var before=solve().cost;
    if(bestAll&&bestCost<before-1e-9){state.mitarbeiter.forEach(function(m){if(bestAll[m.id]!=null)m.phase=bestAll[m.id]});markDirty();ui.msg={t:'Neue Startverteilung übernommen. Prüfe den Plan und setze bei passenden Leuten „Startwoche fest“.',ok:true}}
    else ui.msg={t:'Die aktuelle Startverteilung ist schon die beste gefundene.',ok:true};
    ui.busy='';render();
  }
  setTimeout(runOne,30);
}

/* Auswertung */
function evaluate(r,von,bis){
  var codes=state.schichten.map(function(x){return x.code});
  return state.mitarbeiter.map(function(m){
    var o={m:m,wk:{},abs:{G:0,U:0,K:0},arbeit:0,jumps:0};codes.forEach(function(c){o.wk[c]=0});
    for(var w=von-1;w<=bis-1;w++){
      if(!active(m,w))continue;var x=r.cells[m.id][w];
      if(x.c&&!x.away){if(o.wk[x.c]==null)o.wk[x.c]=0;o.wk[x.c]++}
      if(x.jump)o.jumps++;
      for(var d=0;d<5;d++){var a=dayAbs(m,w,d);if(a)o.abs[a]=(o.abs[a]||0)+1;else if(x.c)o.arbeit++}
    }
    return o});
}

function viewEval(){

  var rows=evaluate(r,ui.von,ui.bis),sc=state.schichten;
  var h='<div class="toolbar"><div class="grp"><label class="inl" for="evv">Zeitraum von KW</label><input type="number" id="evv" data-f="ev:von" min="1" max="'+W+'" value="'+ui.von+'"><label class="inl" for="evb">bis KW</label><input type="number" id="evb" data-f="ev:bis" min="1" max="'+W+'" value="'+ui.bis+'">'+
        '<select id="evm" data-f="ev:mon" aria-label="Zeitraum nach Monat"><option value="">Monat / Quartal</option>'+MONTHS_L.map(function(n,i){return '<option value="m'+i+'">'+n+'</option>'}).join('')+'<option value="q0">1. Quartal</option><option value="q1">2. Quartal</option><option value="q2">3. Quartal</option><option value="q3">4. Quartal</option></select>'+
        '<button class="btn small" data-act="ev-all">Ganzes Jahr</button><button class="btn small" data-act="ev-now">Bis heute</button></div><button class="btn" data-act="csv-ev">Auswertung als Excel-Datei (CSV)</button></div>';
  h+='<p class="hint">KW '+ui.von+' ('+dm(monday(ui.von-1))+') bis KW '+ui.bis+' ('+dm(monday(ui.bis-1)+4*DAY)+state.jahr+'). Schichten zählen in Wochen, Abwesenheiten in Werktagen. Eine Woche, in der jemand ganz abwesend ist, zählt nicht als Schichtwoche.</p>';
  var maxN=0;rows.forEach(function(o){sc.forEach(function(x){maxN=Math.max(maxN,o.wk[x.code]||0)})});
  h+='<div class="tbl-wrap"><table class="ev"><thead><tr><th>Mitarbeiter</th><th style="text-align:left">Schichtmodell</th>'+sc.map(function(x){return '<th>'+sw(x.code)+' '+esc(x.name)+'<br><small style="font-family:var(--body);font-weight:500;color:var(--muted)">Wochen</small></th>'}).join('')+
     '<th>'+swA('U')+' Urlaub<br><small style="font-family:var(--body);font-weight:500;color:var(--muted)">Tage</small></th><th>'+swA('K')+' Krank<br><small style="font-family:var(--body);font-weight:500;color:var(--muted)">Tage</small></th><th>'+swA('G')+' GLZ<br><small style="font-family:var(--body);font-weight:500;color:var(--muted)">Tage</small></th><th>Arbeitstage</th><th>Sprünge</th></tr></thead><tbody>';
  var sum={wk:{},U:0,K:0,G:0,arbeit:0,jumps:0};sc.forEach(function(x){sum.wk[x.code]=0});
  rows.forEach(function(o){
    h+='<tr><td><b>'+esc(o.m.name)+'</b>'+(o.m.springer?'<span class="tagS">Springer</span>':'')+'</td><td class="l">'+esc((rh(o.m.rhythmusId)||{}).name||'-')+'</td>';
    sc.forEach(function(x){var v=o.wk[x.code]||0;sum.wk[x.code]+=v;h+='<td class="'+(v?'':'z')+'">'+v+(v&&maxN?'<span class="bar '+shCls(x.code)+'" style="width:'+Math.round(28*v/maxN)+'px"></span>':'')+'</td>'});
    ['U','K','G'].forEach(function(c){sum[c]+=o.abs[c]||0;h+='<td class="'+(o.abs[c]?'':'z')+'">'+(o.abs[c]||0)+'</td>'});
    sum.arbeit+=o.arbeit;sum.jumps+=o.m.springer?o.jumps:0;
    h+='<td>'+o.arbeit+'</td><td class="'+(o.m.springer?'':'z')+'">'+(o.m.springer?o.jumps:'-')+'</td></tr>';
  });
  h+='<tr class="sum"><td>Summe</td><td class="l">'+rows.length+' Mitarbeiter</td>'+sc.map(function(x){return '<td>'+sum.wk[x.code]+'</td>'}).join('')+'<td>'+sum.U+'</td><td>'+sum.K+'</td><td>'+sum.G+'</td><td>'+sum.arbeit+'</td><td>'+sum.jumps+'</td></tr>';
  return h+'</tbody></table></div>';
}

app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act;
  if(a==='sheetx'&&e.target.closest('[data-stop]')&&b.classList.contains('sheet-bg'))return;
  if(['ma-del','rh-del','sch-del'].indexOf(a)<0)ui.confirm=null;
  if(a==='tab'){ui.tab=b.dataset.v;ui.scrolled=false;ui.exportText=null;render();return}
  if(a==='msgx'){ui.msg=null;render();return}
  if(a==='save'){save();return}
  if(a==='view'){ui.view=b.dataset.v;ui.scrolled=false;render();return}
  if(a==='today'){var nw=nowWeek();if(nw>=0)scrollToWeek(Math.max(0,nw-1));else{ui.scrolled=false;render()}return}
  if(a==='gokw'){scrollToWeek(+b.dataset.w);return}
  if(a==='ev-all'){ui.von=1;ui.bis=weeksIn(state.jahr);render();return}
  if(a==='ev-now'){var nw=nowWeek();ui.von=1;ui.bis=nw>=0?nw+1:(todayUTC()<w1Monday(state.jahr)?1:weeksIn(state.jahr));render();return}
  if(a==='csv'){offer('schichtplan-'+state.jahr+'.csv',csvPlan(),'text/csv');return}
  if(a==='csv-ev'){offer('auswertung-'+state.jahr+'-kw'+ui.von+'-'+ui.bis+'.csv',csvEval(),'text/csv');return}
  if(a==='json'){offer('schichtplan-sicherung-'+state.jahr+'.json',JSON.stringify(state,null,1),'application/json');return}
  if(a==='copy'){var t=document.getElementById('exp');try{navigator.clipboard.writeText(t.value).then(function(){ui.msg={t:'Kopiert.',ok:true};render()},function(){t.select()})}catch(err){t.select()}return}
  if(a==='sheetx'){ui.cell=null;render();return}
  if(a==='namex'){if(e.target.closest('[data-stop]')&&b.classList.contains('sheet-bg'))return;ui.nameEdit=null;render();return}
  if(a==='cell'){ui.cell={id:b.dataset.id,w:+b.dataset.w,d:+(b.dataset.d||0)};render();return}
  if(ui.readOnly)return;
  if(a==='name'){ui.nameEdit=b.dataset.id;ui.nameFocused=false;render();return}
  if(a==='name-ok'){var m=mem(ui.nameEdit),v=(document.getElementById('nm-edit')||{}).value;if(m&&v&&v.trim()){m.name=v.trim();markDirty()}ui.nameEdit=null;render();return}
  if(a==='ph-off'){state.platzhalter=false;markDirty();render();return}
  if(a==='opt'){optimize();return}
  if(a==='ph'){var m=mem(b.dataset.id),L=len(m);if(L){m.phase=((m.phase+(+b.dataset.d))%L+L)%L;markDirty();render()}return}
  if(a==='setd'){var m=mem(ui.cell.id),w=ui.cell.w,d=ui.cell.d||0,t0=monday(w)+d*DAY,bd=document.getElementById('bisd'),t1=t0;
    if(bd&&bd.value){var p=bd.value.split('-');t1=Math.max(t0,Date.UTC(+p[0],+p[1]-1,+p[2]))}
    var o=state.tage[m.id]||(state.tage[m.id]={});
    for(var t=t0;t<=t1;t+=DAY){var dow=(new Date(t).getUTCDay()+6)%7;if(dow>4)continue;if(b.dataset.c==='clear')delete o[iso(t)];else o[iso(t)]=b.dataset.c}
    ui.cell=null;markDirty();render();return}
  if(a==='setc'){var m=mem(ui.cell.id),w=ui.cell.w,bi=document.getElementById('bis'),to=Math.max(w,Math.min(weeksIn(state.jahr)-1,(parseInt(bi&&bi.value,10)||w+1)-1));
    var o=state.abw[m.id]||(state.abw[m.id]={});for(var i=w;i<=to;i++){if(b.dataset.c==='__auto')delete o[key(i)];else o[key(i)]=b.dataset.c}
    ui.cell=null;markDirty();render();return}
  if(a==='ma-add'){var r0=state.rhythmen[0];state.mitarbeiter.push({id:uid('m'),name:'Neu',rhythmusId:r0?r0.id:'',phase:0,springer:false,anlage:true,ab:1,fest:false});markDirty();render();return}
  if(a==='ma-del'){var id=b.dataset.id;if(ui.confirm!=='m:'+id){ui.confirm='m:'+id;render();return}state.mitarbeiter=state.mitarbeiter.filter(function(m){return m.id!==id});delete state.abw[id];delete state.tage[id];ui.confirm=null;markDirty();render();return}
  if(a==='rh-add'){state.rhythmen.push({id:uid('r'),name:'Neues Schichtmodell',folge:[state.schichten[0].code]});markDirty();render();return}
  if(a==='rh-push'){var r=rh(b.dataset.id);r.folge.push(b.dataset.c);markDirty();render();return}
  if(a==='rh-rm'){var r=rh(b.dataset.id);if(r.folge.length>1){r.folge.splice(+b.dataset.i,1);state.mitarbeiter.forEach(function(m){if(m.rhythmusId===r.id&&m.phase>=r.folge.length)m.phase=0});markDirty();render()}return}
  if(a==='rh-del'){var id=b.dataset.id;if(ui.confirm!=='r:'+id){ui.confirm='r:'+id;render();return}state.rhythmen=state.rhythmen.filter(function(r){return r.id!==id});ui.confirm=null;markDirty();render();return}
  if(a==='sch-add'){var pool='TXZABCDEHIJLMOPQRVWY'.split(''),c=null;for(var i=0;i<pool.length;i++)if(!sch(pool[i])){c=pool[i];break}if(!c)c='T'+state.schichten.length;
    state.schichten.push({code:c,name:'Neue Schicht',von:'07:00',bis:'15:30',farbe:'gruen',besetzung:false,springer:false});markDirty();render();return}
  if(a==='sch-del'){var i=+b.dataset.i;if(ui.confirm!=='s:'+i){ui.confirm='s:'+i;render();return}state.schichten.splice(i,1);ui.confirm=null;markDirty();render();return}
});
app.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='imp'&&t.files&&t.files[0]){var fr=new FileReader();fr.onload=function(){try{var s=JSON.parse(fr.result);if(!s||!Array.isArray(s.mitarbeiter)||!Array.isArray(s.rhythmen))throw 0;s.gespeichert=state.gespeichert;state=migrate(s);markDirty();ui.msg={t:'Sicherung eingespielt. Zum Behalten auf „Speichern“ tippen.',ok:true}}catch(err){ui.msg={t:'Diese Datei ist keine Schichtplaner-Sicherung.',bad:true}}render()};fr.readAsText(t.files[0]);return}
  var f=t.dataset&&t.dataset.f;if(!f)return;
  if(f==='gokw'){var g=app.querySelector('.grid-wrap');if(g&&t.value!==''){var ws=+t.value;g.scrollLeft=g.dataset.unit==='day'?ws*7*cssPx('--day-w',24):ws*cssPx('--cell-w',32)}return}
  var p=f.split(':');
  if(f==='ev:mon'){if(t.value){var ms=monthWeeks(weeksIn(state.jahr)),sel=t.value[0]==='m'?[+t.value.slice(1)]:[0,1,2].map(function(i){return +t.value.slice(1)*3+i});var ws=[];sel.forEach(function(i){ws=ws.concat(ms[i])});if(ws.length){ui.von=ws[0]+1;ui.bis=ws[ws.length-1]+1}}render();return}
  if(p[0]==='ev'){var v=parseInt(t.value,10);if(v>=1){if(p[1]==='von'){ui.von=v;if(ui.bis<v)ui.bis=v}else{ui.bis=v;if(ui.von>v)ui.von=v}}render();return}
  if(ui.readOnly)return;
  if(p[0]==='g'){var v=parseInt(t.value,10);if(p[1]==='jahr'&&v>=2020&&v<=2100){state.jahr=v;ui.von=1;ui.bis=weeksIn(v)}if(p[1]==='anlagen'&&v>=1&&v<=50)state.anlagen=v;markDirty();render();return}
  if(p[0]==='m'){var m=mem(p[1]);if(!m)return;var k=p[2];
    if(t.type==='checkbox')m[k]=t.checked;else if(k==='phase')m.phase=parseInt(t.value,10)||0;else if(k==='ab')m.ab=Math.max(1,Math.min(53,parseInt(t.value,10)||1));else if(k==='rhythmusId'){m.rhythmusId=t.value;m.phase=0}else m[k]=t.value.trim()||m[k];
    markDirty();render();return}
  if(p[0]==='r'){var r=rh(p[1]);if(r&&p[2]==='name'){r.name=t.value.trim()||r.name;markDirty();render()}return}
  if(p[0]==='s'){var s=state.schichten[+p[1]];if(!s)return;var k=p[2];
    if(k==='code'){var nc=t.value.trim().toUpperCase();
      if(nc===s.code){render();return}
      if(!/^[A-Z0-9ÄÖÜ]{1,3}$/.test(nc)){ui.msg={t:'Das Kürzel darf 1 bis 3 Buchstaben oder Ziffern haben.',bad:true};render();return}
      if(ABS[nc]){ui.msg={t:'G, U und K sind für GLZ, Urlaub und Krank reserviert. Bitte ein anderes Kürzel wählen.',bad:true};render();return}
      if(sch(nc)){ui.msg={t:'Das Kürzel '+nc+' gibt es schon.',bad:true};render();return}
      var old=s.code;state.rhythmen.forEach(function(r){r.folge=r.folge.map(function(c){return c===old?nc:c})});
      Object.keys(state.abw).forEach(function(id){var o=state.abw[id];Object.keys(o).forEach(function(kk){if(o[kk]===old)o[kk]=nc})});
      s.code=nc}
    else if(t.type==='checkbox')s[k]=t.checked;
    else if(k==='name')s.name=t.value.trim()||s.name;
    else s[k]=t.value;
    markDirty();render();return}
});
